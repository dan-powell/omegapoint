all:
  vars:
    ansible_host: # example.com
    ansible_port: # 22
    ansible_user: # user
    cloudflare_email: #
    cloudflare_api_key: #
production:
  hosts:
    omegapoint-production:
      id: omegapoint
      domain: "omegapoint.city"
      # Add any additional domains here including www, comment out if no other domains required
      other_domains: 
        - "*.omegapoint.city"
staging:
  hosts:
    omegapoint-staging:
      id: omegapoint-staging
      domain: "staging.omegapoint.city"
      # Add any additional domains here including www, comment out if no other domains required
      other_domains: 
        - "media.staging.omegapoint.city"
        - "news.staging.omegapoint.city"
